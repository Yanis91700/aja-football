# Configuration Netlify — AJA Football

[build]
  # À chaque publication depuis l'espace admin, Netlify relance ce script :
  # il relit le dossier content/ et régénère assets/contenu.js.
  command = "node build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# --- En-têtes de sécurité (tout le site) --------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- L'espace admin ne doit jamais être indexé ni mis en cache ----------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# --- Cache long UNIQUEMENT pour les images -------------------------------
# Elles ne changent pas : autant les garder en mémoire une semaine.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- Le contenu du site est revalidé à chaque visite ---------------------
# contenu.js est régénéré à chaque publication depuis l'admin : il ne doit
# jamais rester en cache, sinon les modifications mettraient des jours à
# apparaître chez les visiteurs.
[[headers]]
  for = "/assets/contenu.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# --- Les pages sont revalidées à chaque visite ---------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- URL propres : /contact vaut /contact.html ---------------------------
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/planning"
  to = "/planning.html"
  status = 200

[[redirects]]
  from = "/equipes"
  to = "/equipes.html"
  status = 200

[[redirects]]
  from = "/galerie"
  to = "/galerie.html"
  status = 200

[[redirects]]
  from = "/actualites"
  to = "/actualites.html"
  status = 200
